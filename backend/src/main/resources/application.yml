# Runtime configuration. Supabase is the only backing service:
#  - Postgres database (schema "ledgerly")
#  - Storage bucket for original documents
#  - Auth for sign-up / sign-in (the API verifies Supabase access tokens)
# Values come from environment variables or git-ignored local configuration files.
# The Windows Supabase startup script can generate .env.supabase for Eclipse.
spring:
  application:
    name: manage-invoice
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]
      - optional:file:../.env.supabase[.properties]
      - optional:file:.env.supabase[.properties]
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ledgerly
  flyway:
    enabled: true
    schemas: ledgerly
    default-schema: ledgerly

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8094}

security:
  supabase:
    url: ${SUPABASE_URL}
    publishable-key: ${SUPABASE_PUBLISHABLE_KEY}

storage:
  supabase:
    service-key: ${SUPABASE_SERVICE_ROLE_KEY}
    bucket: ${SUPABASE_STORAGE_BUCKET:ledgerly-documents}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

ocr:
  tesseract-command: ${OCR_TESSERACT_COMMAND:tesseract}

receipt:
  ai:
    enabled: ${RECEIPT_AI_ENABLED:false}
    port: ${RECEIPT_AI_PORT:11435}
    model: ${RECEIPT_AI_MODEL:qwen2.5vl:3b}
