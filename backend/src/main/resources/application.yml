spring:
  application:
    name: saas-starter-api
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/saas_starter}
    username: ${DATABASE_USERNAME:saas_starter}
    password: ${DATABASE_PASSWORD:saas_starter}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
security:
  jwt:
    secret: ${JWT_SECRET}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

storage:
  local:
    root: ${STORAGE_LOCAL_ROOT:./storage}

billing:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:5173/app#billing?success=true}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:5173/app#billing?cancelled=true}
    return-url: ${STRIPE_RETURN_URL:http://localhost:5173/app#billing}
    prices:
      starter-monthly: ${STRIPE_PRICE_STARTER_MONTHLY:}
      starter-yearly: ${STRIPE_PRICE_STARTER_YEARLY:}
      pro-monthly: ${STRIPE_PRICE_PRO_MONTHLY:}
      pro-yearly: ${STRIPE_PRICE_PRO_YEARLY:}
      team-monthly: ${STRIPE_PRICE_TEAM_MONTHLY:}
      team-yearly: ${STRIPE_PRICE_TEAM_YEARLY:}
