# The test initializer isolates database operations in ledgerly_test on Supabase.
# Auth and Storage remain in-process fakes; no real user accounts or objects are created.
spring:
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
server:
  port: 0
security:
  supabase:
    url: https://test-project.supabase.co
    publishable-key: test-publishable-key
storage:
  supabase:
    service-key: test-service-key
